[package]
name = "duck_core"
version = "1.0.0"
edition = "2021"
description = "Core in memoria di Duck Printer Manager: coda task, log ring-buffer, parsing host/MAC (C ABI)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
